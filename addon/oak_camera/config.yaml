# Home Assistant add-on manifest.
#
# This add-on installs a prebuilt image instead of building from a Dockerfile.
# An add-on builds with its own folder as the Docker context, so a Dockerfile
# placed here could not COPY the Python source from the repository root. The
# release workflow builds one multi-architecture image and pushes it to GHCR,
# which also removes the local build on the user's Raspberry Pi.
name: "OAK-D LR Camera"
description: "Luxonis OAK-D LR PoE camera with on-device AI detection, RTSP stream, motion recording, and HA events."
version: "3.0.1"
slug: "oak_camera"
url: "https://github.com/crystalheeler/Luxonis-OAK-D-LR"
image: "ghcr.io/crystalheeler/luxonis-oak-d-lr"

init: false
host_network: true
arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8767
panel_icon: mdi:camera-iris
panel_title: OAK Camera

options:
  camera_ip: ""
  mjpeg_port: 8765
  fps: 15
  detection_model: "yolov6-nano"
  filename_tag_objects: true
  storage_alert_enabled: true
  storage_alert_threshold: 50
  models_dir: "/media/oak_models"
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""

schema:
  camera_ip: str
  mjpeg_port: int
  fps: "int(5,30)"
  detection_model: "list(yolov6-nano|luxonis/mobilenet-ssd:300x300|yolo11n)"
  filename_tag_objects: bool
  storage_alert_enabled: bool
  storage_alert_threshold: "int(0,100)"
  models_dir: str
  ha_url: str
  ha_token: str

map:
  - type: media
    read_only: false

homeassistant_api: true
