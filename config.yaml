name: "OAK-D LR Camera"
description: "Connects to a Luxonis OAK-D LR PoE camera, runs on-device object detection, serves an RTSP stream, records clips on detection, monitors storage, and fires HA events."
version: "2.1.3"
slug: "oak_camera"
init: false
host_network: true
arch:
  - aarch64
  - amd64

options:
  camera_ip: ""
  mjpeg_port: 8765
  fps: 15
  detection_model: "yolov6-nano"
  confidence_threshold: 0.5
  detect_people: true
  detect_animals: true
  detect_vehicles: false
  storage_alert_enabled: true
  storage_alert_threshold: 50
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""

schema:
  camera_ip: str
  mjpeg_port: int
  fps: "int(5,30)"
  detection_model: "list(yolov6-nano|luxonis/mobilenet-ssd:300x300)"
  confidence_threshold: float
  detect_people: bool
  detect_animals: bool
  detect_vehicles: bool
  storage_alert_enabled: bool
  storage_alert_threshold: "int(0,100)"
  ha_url: str
  ha_token: str

map:
  - type: media
    read_only: false

homeassistant_api: true
changelog: CHANGELOG.md
