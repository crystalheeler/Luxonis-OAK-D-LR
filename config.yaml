name: "OAK-D LR Camera"
description: "Connects to a Luxonis OAK-D LR PoE camera, runs YOLOv6n object detection, serves an RTSP stream, records clips on detection, and fires HA events."
version: "1.9.0"
slug: "oak_camera"
init: false
host_network: true
arch:
  - aarch64
  - amd64

options:
  camera_ip: ""
  mjpeg_port: 8765
  confidence_threshold: 0.5
  detect_people: true
  detect_animals: true
  detect_vehicles: false
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""

schema:
  camera_ip: str
  mjpeg_port: int
  confidence_threshold: float
  detect_people: bool
  detect_animals: bool
  detect_vehicles: bool
  ha_url: str
  ha_token: str

map:
  - type: media
    read_only: false

homeassistant_api: true
changelog: CHANGELOG.md
